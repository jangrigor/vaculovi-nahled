name: Deploy to Hostinger

# Stejný kód se pushuje do dvou repozitářů (ostrý `vaculovi` i náhledový
# `vaculovi-nahled`), takže tenhle workflow je v obou. Nahrávat se ale musí
# jen tam, kde je opravdu nastavené FTP — proto ten guard přes FTP_SERVER.
# V repozitáři bez secrets se krok jen přeskočí, workflow neselže.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Bez nastaveného FTP se nenasazuje
        if: env.FTP_SERVER == ''
        run: echo "Secret FTP_SERVER není nastavený — přeskakuji nasazení na Hostinger."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - uses: actions/setup-node@v4
        if: env.FTP_SERVER != ''
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: env.FTP_SERVER != ''

      - run: npm run build
        if: env.FTP_SERVER != ''

      # CNAME patří jen GitHub Pages, na Hostingeru nemá co dělat.
      - name: Odstranit CNAME z buildu
        if: env.FTP_SERVER != ''
        run: rm -f dist/CNAME

      - name: Nahrát na Hostinger přes FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Hostinger dává jako hostname IP adresu, na kterou certifikát
          # nemůže sedět — přísná kontrola by spojení shodila. Přenos je
          # i tak šifrovaný, na rozdíl od holého FTP.
          security: loose
          local-dir: ./dist/
          # Kam na serveru. Nastav repository variable FTP_SERVER_DIR,
          # když web nemá být v kořeni (např. /public_html/nahled/).
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          # Action si na serveru drží stav a posílá jen změněné soubory —
          # 6,5MB hero.mp4 se tak nenahrává při každém pushi znovu.
          state-name: .ftp-deploy-state.json
          dangerous-clean-slate: false
