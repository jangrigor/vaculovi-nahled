name: Deploy to Hostinger

# Stejný kód se pushuje do dvou repozitářů (ostrý `vaculovi` i náhledový
# `vaculovi-nahled`), takže tenhle workflow je v obou. Nasazovat se ale musí
# jen tam, kde je opravdu nastavené SSH — proto ten guard přes SSH_HOST.
# V repozitáři bez secrets se kroky jen přeskočí, workflow neselže.
#
# Proč SSH a ne FTP: Hostinger blokuje FTP z datacentrových IP adres,
# runnery GitHubu se na port 21 vůbec nedovolají (Timeout (control socket)).
# SSH na portu 65002 blokované není.

# POZOR: tenhle způsob nasazení dnes nefunguje. Hostinger zahazuje spojení
# z IP adres GitHubu i na portu 65002 ("Connection timed out", tři pokusy
# za sebou), stejně jako předtím na FTP. Nasazuje se proto přes
# hostinger-build.yml, který jen uloží build do větve `deploy`, a Hostinger
# si ho stáhne sám. Spouštění při pushi je tady vypnuté, aby workflow
# nehlásil chybu po každé změně — ruční spuštění zůstává pro případ, že by
# Hostinger blokaci zrušil.
on:
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

env:
  SSH_PORT: 65002

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Bez nastaveného SSH se nenasazuje
        if: env.SSH_HOST == ''
        run: echo "Secret SSH_HOST není nastavený — přeskakuji nasazení na Hostinger."

      - uses: actions/checkout@v4
        if: env.SSH_HOST != ''

      - uses: actions/setup-node@v4
        if: env.SSH_HOST != ''
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: env.SSH_HOST != ''

      - run: npm run build
        if: env.SSH_HOST != ''

      # CNAME patří jen GitHub Pages, na Hostingeru nemá co dělat.
      - name: Odstranit CNAME z buildu
        if: env.SSH_HOST != ''
        run: rm -f dist/CNAME

      # Otisk serveru je zadaný napevno přes secret SSH_HOST_KEY místo
      # stahování přes ssh-keyscan. Ten měl pětisekundový timeout a když se
      # runner k serveru nedovolal, shodil pod `bash -e` celý krok dřív, než
      # se vůbec zkusilo nasazení. Pevný otisk je navíc bezpečnější — klíč
      # se neověřuje tím, co zrovna odpoví protistrana.
      - name: Připravit SSH klíč
        if: env.SSH_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '[%s]:%s %s\n' "$SSH_HOST" "$SSH_PORT" "${{ secrets.SSH_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Nahrát na Hostinger přes rsync
        if: env.SSH_HOST != ''
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          # Kam na serveru. Cesta musí končit lomítkem.
          TARGET_DIR: ${{ vars.SSH_TARGET_DIR || '/domains/rfkl.eu/public_html/' }}
        # Hostinger občas spojení z datacentrových IP odmítne (kvůli tomu se
        # opustilo FTP a stejně to umí potrápit i SSH). Tři pokusy s odstupem
        # přes dočasné omezení přejdou; když neprojde ani třetí, krok selže
        # nahlas, ať se na to nepřijde až podle zastaralého webu.
        run: |
          for pokus in 1 2 3; do
            if rsync -rlz --delete \
                 -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
                 dist/ "$SSH_USER@$SSH_HOST:$TARGET_DIR"; then
              echo "Nasazeno na $pokus. pokus."
              exit 0
            fi
            echo "Pokus $pokus selhal."
            [ "$pokus" -lt 3 ] && sleep 30
          done
          echo "Nasazení na Hostinger neprošlo ani po třech pokusech."
          exit 1

      - name: Uklidit klíč
        if: always() && env.SSH_HOST != ''
        run: rm -f ~/.ssh/deploy_key
